# Tema fixo para a paleta editorial do app nao brigar com o tema do sistema.
# Duas cores de acento (laranja de quadra + verde-petroleo) sobre neutros quentes.

[theme]
base = "light"
primaryColor = "#BF4417"
backgroundColor = "#FBFAF8"
